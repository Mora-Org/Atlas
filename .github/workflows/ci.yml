name: CI

# M-Ops F2: até aqui não existia CI — as 12 suítes pytest só rodavam via
# run_tests.ps1 manual e o build de produção ignora TS/ESLint por config.
# Este pipeline torna pytest + vitest + build bloqueantes em todo push/PR.
on:
  push:
  pull_request:

# cancela run antigo do mesmo ref quando chega push novo
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: install deps
        run: pip install -r requirements.txt
      - name: pytest
        env:
          SKIP_TEST_SEED: "1"
        run: python -m pytest -q

  frontend:
    name: frontend (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install deps
        run: npm ci
      - name: vitest
        run: npm run test
      - name: build
        run: npm run build
      # tsc/lint AINDA NÃO bloqueiam: o build os ignora por config
      # (next.config.ts) e há dívida pré-existente (eslint key em NextConfig,
      # setState-in-effect no schema/page). Viram gate numa fatia futura do
      # M-Ops, depois da limpeza de TS — ver milestone_ops_observabilidade.md F2.
